name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-kubelogin
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true
      - name: Assert kubelogin setup outcome
        env:
          OUTCOME: ${{ steps.setup-kubelogin.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking kubelogin is on PATH..."
            if ! command -v kubelogin > /dev/null 2>&1; then
              echo "FAIL: kubelogin not found on PATH after successful setup"
              exit 1
            fi
            echo "PASS: kubelogin found at $(command -v kubelogin)"
            kubelogin --version || true
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely network/API issue in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
