name: Test github-api-base-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-api-base-url: https://api.github.com
        continue-on-error: true
      - name: Assert kubelogin is available or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if ! command -v kubelogin >/dev/null 2>&1; then
              echo "FAIL: kubelogin not found in PATH after successful action"
              exit 1
            fi
            echo "PASS: kubelogin is available at $(command -v kubelogin)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo may have caused API issues)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
