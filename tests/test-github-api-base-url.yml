name: Test github-api-base-url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-api-base-url: 'https://api.github.com'
        continue-on-error: true
      - name: Assert kubelogin was installed or action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            # Verify kubelogin is available on PATH
            if command -v kubelogin >/dev/null 2>&1; then
              echo "PASS: kubelogin is available on PATH"
              kubelogin --version
            else
              echo "FAIL: kubelogin not found on PATH after successful action"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
