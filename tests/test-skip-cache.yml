name: Test skip-cache option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          skip-cache: 'true'
      - name: Assert kubelogin is installed even when cache is skipped
        run: |
          echo "Checking kubelogin is available after skip-cache install..."
          if ! command -v kubelogin >/dev/null 2>&1; then
            echo "FAIL: kubelogin not found on PATH"
            exit 1
          fi
          echo "kubelogin found at: $(command -v kubelogin)"
          VERSION_OUTPUT="$(kubelogin --version 2>&1 || true)"
          echo "Version output: $VERSION_OUTPUT"
          echo "PASS"
