name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          kubelogin-version: 'v0.1.3'
        continue-on-error: true
      - name: Assert kubelogin is installed with the correct version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking kubelogin is available..."
            if ! command -v kubelogin >/dev/null 2>&1; then
              echo "FAIL: kubelogin not found on PATH after successful action"
              exit 1
            fi
            VERSION_OUTPUT="$(kubelogin --version 2>&1 || true)"
            echo "kubelogin version output: $VERSION_OUTPUT"
            if echo "$VERSION_OUTPUT" | grep -q "0.1.3"; then
              echo "PASS: kubelogin v0.1.3 is installed"
            else
              echo "FAIL: expected version 0.1.3 but got: $VERSION_OUTPUT"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (likely node24 runtime or network issue in act environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
